name: Build and publish address book JAR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java and GitHub Packages credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and publish uniquely versioned JAR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "Publishing com.example:address-book-microservices:${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "### Maven package" >> "$GITHUB_STEP_SUMMARY"
          echo "\`com.example:address-book-microservices:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          mvn --batch-mode --no-transfer-progress -Drevision="${VERSION}" deploy
        id: publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # - name: Build and test JAR
      #   if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
