name: Test and publish address book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      # Get the source code for this run.
      - name: Check out source
        uses: actions/checkout@v4

      # Install Java 21 and reuse Maven downloads between runs.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Self-hosted runners do not include Maven automatically.
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.9

      # Run tests, build the JAR, and create/check the JaCoCo coverage report.
      - name: Test and check coverage
        id: verify
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          mvn --batch-mode --no-transfer-progress -Drevision="${VERSION}" clean verify

      # Save the coverage report and test results, including when tests fail.
      - name: Save coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            target/site/jacoco/
            target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 14

      # Save the runnable JAR for download from the Actions run.
      - name: Save JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: address-book-${{ github.run_number }}-${{ github.run_attempt }}
          path: target/address-book.jar
          if-no-files-found: error
          retention-days: 30

      # Configure Cloudsmith credentials only for publishing on main.
      - name: Set up Cloudsmith credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: cloudsmith
          server-username: CLOUDSMITH_USERNAME
          server-password: CLOUDSMITH_API_KEY
        env:
          CLOUDSMITH_USERNAME: ${{ secrets.CLOUDSMITH_USERNAME }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}

      # Publish the tested JAR and Maven metadata to Cloudsmith.
      - name: Publish JAR to Cloudsmith
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          CLOUDSMITH_WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          CLOUDSMITH_MAVEN_REPOSITORY: ${{ vars.CLOUDSMITH_MAVEN_REPOSITORY }}
        run: |
          set -euo pipefail
          : "${CLOUDSMITH_WORKSPACE:?Set the CLOUDSMITH_WORKSPACE repository variable}"
          : "${CLOUDSMITH_MAVEN_REPOSITORY:?Set the CLOUDSMITH_MAVEN_REPOSITORY repository variable}"
          mvn --batch-mode --no-transfer-progress \
            -Dcloudsmith.workspace="${CLOUDSMITH_WORKSPACE}" \
            -Dcloudsmith.repository="${CLOUDSMITH_MAVEN_REPOSITORY}" \
            -Drevision="${VERSION}" deploy -DskipTests
