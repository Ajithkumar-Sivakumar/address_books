name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check Cloudsmith login
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: cloudsmith-io/cloudsmith-cli-action@v3
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          verify-auth: "true"

      - name: Test and publish
        env:
          CLOUDSMITH_WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
          CLOUDSMITH_MAVEN_REPOSITORY: ${{ vars.CLOUDSMITH_MAVEN_REPOSITORY }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            cloudsmith credential-helper install maven
            mvn --batch-mode --no-transfer-progress clean deploy \
              -Drevision="${VERSION}" \
              -Dcloudsmith.workspace="${CLOUDSMITH_WORKSPACE}" \
              -Dcloudsmith.repository="${CLOUDSMITH_MAVEN_REPOSITORY}"
          else
            mvn --batch-mode --no-transfer-progress clean verify
          fi
