name: Address Book Build and Publish # Name shown in GitHub Actions.

# Run on pushes to any branch, pull requests targeting main, or manual runs.
on:
  push:
    branches: ['**'] # Test and publish changes pushed to any branch.
  pull_request:
    branches: [main] # Test pull requests; do not publish their artifacts.
  workflow_dispatch: # Allow a manual run from the Actions page.

# Give the workflow read-only access to the repository.
permissions:
  contents: read # Needed to check out the source code.

jobs:
  build:
    runs-on: ubuntu-latest # Use a GitHub-hosted Linux runner.
    steps:
      # Download the repository source at the commit that triggered this run.
      - uses: actions/checkout@v4

      # Install Java 21 and cache Maven dependencies to speed up future runs.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin # Use the Eclipse Temurin Java distribution.
          java-version: "21" # This project requires Java 21.
          cache: maven # Reuse downloaded Maven dependencies.

      # Compile the application, run tests, create the JAR, and enforce JaCoCo coverage rules.
      - name: Build, Test and check coverage
        env:
          VERSION: 1.0.${{ github.run_number }}.${{ github.run_attempt }} # Create a unique build version.
        run: mvn --batch-mode --no-transfer-progress clean verify -Drevision="${VERSION}" # Run Maven's full verification phase.

      # Authenticate on branch pushes or manual runs, but never on pull requests.
      - name: Sign in to Cloudsmith
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' # Keep publishing credentials away from pull requests.
        uses: cloudsmith-io/cloudsmith-cli-action@v3 # Install the Cloudsmith CLI and sign in.
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }} # Read the API key from GitHub Actions secrets.
          verify-auth: "true" # Fail now if Cloudsmith rejects the key.

      # Publish the already-tested package and show its Cloudsmith link in the run summary.
      - name: Publish to Cloudsmith
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' # Publish branch pushes and manual runs only.
        env:
          VERSION: 1.0.${{ github.run_number }}.${{ github.run_attempt }} # Match the version tested above.
          CLOUDSMITH_WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }} # Cloudsmith workspace slug.
          CLOUDSMITH_MAVEN_REPOSITORY: ${{ vars.CLOUDSMITH_MAVEN_REPOSITORY }} # Cloudsmith Maven repository slug.
        run: |
          set -euo pipefail # Stop if a command fails or a required variable is missing.
          : "${CLOUDSMITH_WORKSPACE:?Set the CLOUDSMITH_WORKSPACE repository variable}" # Require the workspace setting.
          : "${CLOUDSMITH_MAVEN_REPOSITORY:?Set the CLOUDSMITH_MAVEN_REPOSITORY repository variable}" # Require the repository setting.

          REPOSITORY_URL="https://cloudsmith.io/~${CLOUDSMITH_WORKSPACE}/repos/${CLOUDSMITH_MAVEN_REPOSITORY}/packages/?q=format%3Amaven" # Open the Maven packages list.
          echo "Publishing version ${VERSION}" # Show which package version is being uploaded.
          echo "Cloudsmith repository: ${REPOSITORY_URL}" # Print where to find published packages.
          cloudsmith credential-helper install maven --local # Make Maven use Cloudsmith credentials.
          # Deploy the verified package to the configured Cloudsmith Maven repository.
          mvn --batch-mode --no-transfer-progress deploy \
            -Drevision="${VERSION}" \
            -Dcloudsmith.workspace="${CLOUDSMITH_WORKSPACE}" \
            -Dcloudsmith.repository="${CLOUDSMITH_MAVEN_REPOSITORY}" \
            -DskipTests
          {
            echo "## Published to Cloudsmith" # Add a heading to the GitHub Actions run summary.
            echo "- Version: \`${VERSION}\`" # Show the published version.
            echo "- Repository: [${CLOUDSMITH_WORKSPACE}/${CLOUDSMITH_MAVEN_REPOSITORY}](${REPOSITORY_URL})" # Link to Cloudsmith.
          } >> "$GITHUB_STEP_SUMMARY"
