      #     VERSION: ${{ steps.verify.outputs.version }}
      #     CLOUDSMITH_WORKSPACE: ${{ vars.CLOUDSMITH_WORKSPACE }}
      #     CLOUDSMITH_DOCKER_REPOSITORY: ${{ vars.CLOUDSMITH_DOCKER_REPOSITORY }}
      #   run: |
